<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Onward</title>
  <meta name="description" content="Onward — a calm, beautiful todo list.">
  <meta name="theme-color" content="#f4f0e8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem('onward:theme'));
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" class="brand-bg"/>
          <path d="M9.5 16.5l4.5 4.5 8.5-9.5" class="brand-tick"/>
        </svg>
        <span>Onward</span>
      </div>
      <button class="icon-btn theme-btn" id="theme-toggle" type="button" aria-label="Switch theme">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.5 12h-2M21.5 12h-2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
      </button>
    </header>

    <main>
      <section class="hero">
        <div class="hero-text">
          <p class="eyebrow" id="today-label"></p>
          <h1 class="greeting" id="greeting">Hello</h1>
          <p class="summary" id="summary"></p>
        </div>
        <div class="ring" id="ring" role="img" aria-label="No tasks yet">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle class="ring-track" cx="32" cy="32" r="27"/>
            <circle class="ring-bar" id="ring-bar" cx="32" cy="32" r="27"/>
          </svg>
          <span class="ring-label" id="ring-label">0%</span>
        </div>
      </section>

      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-row">
          <span class="composer-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>
          </span>
          <label class="sr-only" for="new-title">New task</label>
          <input class="composer-input" id="new-title" type="text" placeholder="What needs doing?" maxlength="300" enterkeyhint="done">
          <button class="add-btn" id="add-btn" type="submit" disabled>
            <span>Add</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 10l-5 5 5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>
          </button>
        </div>
        <div class="composer-meta">
          <div class="prio-picker" id="new-priority" role="radiogroup" aria-label="Priority" data-value="none">
            <button type="button" class="prio-option" role="radio" aria-checked="true" data-priority="none"><span class="prio-dot"></span><span class="prio-label">None</span></button>
            <button type="button" class="prio-option" role="radio" aria-checked="false" data-priority="low" tabindex="-1"><span class="prio-dot"></span><span class="prio-label">Low</span></button>
            <button type="button" class="prio-option" role="radio" aria-checked="false" data-priority="medium" tabindex="-1"><span class="prio-dot"></span><span class="prio-label">Medium</span></button>
            <button type="button" class="prio-option" role="radio" aria-checked="false" data-priority="high" tabindex="-1"><span class="prio-dot"></span><span class="prio-label">High</span></button>
          </div>
          <div class="date-field" id="new-due" data-value="">
            <button type="button" class="date-btn" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
              <span class="date-label">Due date</span>
            </button>
            <button type="button" class="date-clear" aria-label="Clear due date">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
            </button>
            <input type="date" class="date-input" tabindex="-1" aria-hidden="true">
          </div>
        </div>
      </form>

      <div class="toolbar">
        <div class="tabs" id="tabs" role="tablist" aria-label="Filter tasks">
          <span class="tab-indicator" id="tab-indicator" aria-hidden="true"></span>
          <button class="tab" type="button" role="tab" data-filter="all" aria-selected="true">All <span class="tab-count" data-count="all">0</span></button>
          <button class="tab" type="button" role="tab" data-filter="active" aria-selected="false">Active <span class="tab-count" data-count="active">0</span></button>
          <button class="tab" type="button" role="tab" data-filter="completed" aria-selected="false">Done <span class="tab-count" data-count="completed">0</span></button>
        </div>
        <button class="text-btn" id="clear-done" type="button">Clear done</button>
      </div>

      <section class="panel" aria-label="Tasks">
        <ul class="list" id="list"></ul>
        <div class="empty" id="empty" hidden>
          <svg class="empty-art" viewBox="0 0 160 110" aria-hidden="true">
            <g class="empty-sun">
              <path d="M44 78a36 36 0 0 1 72 0" class="sun-disc"/>
              <path d="M80 26v-12M52 36l-8-8M108 36l8-8M36 60l-11-4M124 60l11-4" class="sun-rays"/>
            </g>
            <path d="M16 79h128" class="horizon"/>
            <path d="M36 92h44M92 92h22M56 103h48" class="horizon horizon-soft"/>
          </svg>
          <h2 id="empty-title">All clear</h2>
          <p id="empty-text">Nothing on your plate.</p>
        </div>
      </section>

      <p class="hint">
        <span class="hint-desktop"><kbd>N</kbd> new task · Double-click to edit · Drag <svg class="hint-grip" viewBox="0 0 12 20" aria-hidden="true"><circle cx="3.5" cy="5" r="1.5"/><circle cx="8.5" cy="5" r="1.5"/><circle cx="3.5" cy="10" r="1.5"/><circle cx="8.5" cy="10" r="1.5"/><circle cx="3.5" cy="15" r="1.5"/><circle cx="8.5" cy="15" r="1.5"/></svg> to reorder</span>
        <span class="hint-touch">Drag the dots to reorder · Saved on this device</span>
      </p>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toast-text"></span>
    <button type="button" id="toast-undo">Undo</button>
  </div>

  <div class="menu" id="date-menu" role="menu" aria-label="Due date">
    <button type="button" class="menu-item" role="menuitem" data-when="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>
      Today <span class="menu-hint"></span>
    </button>
    <button type="button" class="menu-item" role="menuitem" data-when="tomorrow">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h18M6.5 17a5.5 5.5 0 0 1 11 0M12 6v3M5 10l1.5 1.5M19 10l-1.5 1.5"/></svg>
      Tomorrow <span class="menu-hint"></span>
    </button>
    <button type="button" class="menu-item" role="menuitem" data-when="next-week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12M13 7l5 5-5 5"/></svg>
      Next week <span class="menu-hint"></span>
    </button>
    <button type="button" class="menu-item" role="menuitem" data-when="pick">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      Pick a date…
    </button>
    <div class="menu-sep" data-when-sep></div>
    <button type="button" class="menu-item menu-item-danger" role="menuitem" data-when="none">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
      No date
    </button>
  </div>

  <template id="task-template">
    <li class="task">
      <button class="grip" type="button" aria-label="Reorder (drag, or use arrow keys)">
        <svg viewBox="0 0 12 20" aria-hidden="true"><circle cx="3.5" cy="5" r="1.5"/><circle cx="8.5" cy="5" r="1.5"/><circle cx="3.5" cy="10" r="1.5"/><circle cx="8.5" cy="10" r="1.5"/><circle cx="3.5" cy="15" r="1.5"/><circle cx="8.5" cy="15" r="1.5"/></svg>
      </button>
      <button class="check" type="button" role="checkbox" aria-checked="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle class="check-ring" cx="12" cy="12" r="10"/><path class="check-tick" d="M7.5 12.5l3 3 6-6.5"/></svg>
      </button>
      <div class="task-body">
        <p class="task-title"><span></span></p>
        <div class="task-meta">
          <span class="meta-chip meta-due">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
            <span></span>
          </span>
          <span class="meta-chip meta-prio">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 21V4.5M5.5 4.5h11l-2.2 4 2.2 4h-11"/></svg>
            <span></span>
          </span>
        </div>
      </div>
      <div class="task-actions">
        <button class="act act-edit" type="button" aria-label="Edit task">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L18.5 9.5a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13 7l4 4"/></svg>
        </button>
        <button class="act act-delete" type="button" aria-label="Delete task">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
        </button>
      </div>
      <div class="editor">
        <input class="edit-input" type="text" maxlength="300" aria-label="Task title" enterkeyhint="done">
        <div class="editor-row">
          <div class="prio-picker" role="radiogroup" aria-label="Priority" data-value="none">
            <button type="button" class="prio-option" role="radio" aria-checked="true" data-priority="none"><span class="prio-dot"></span><span class="prio-label">None</span></button>
            <button type="button" class="prio-option" role="radio" aria-checked="false" data-priority="low" tabindex="-1"><span class="prio-dot"></span><span class="prio-label">Low</span></button>
            <button type="button" class="prio-option" role="radio" aria-checked="false" data-priority="medium" tabindex="-1"><span class="prio-dot"></span><span class="prio-label">Medium</span></button>
            <button type="button" class="prio-option" role="radio" aria-checked="false" data-priority="high" tabindex="-1"><span class="prio-dot"></span><span class="prio-label">High</span></button>
          </div>
          <div class="date-field" data-value="">
            <button type="button" class="date-btn" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
              <span class="date-label">Due date</span>
            </button>
            <button type="button" class="date-clear" aria-label="Clear due date">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
            </button>
            <input type="date" class="date-input" tabindex="-1" aria-hidden="true">
          </div>
          <div class="editor-actions">
            <button class="btn btn-ghost act-cancel" type="button">Cancel</button>
            <button class="btn btn-primary act-save" type="button">Save</button>
          </div>
        </div>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
