name: Android APK

# Every push to main builds a signed APK and publishes it as a GitHub release,
# which Obtainium picks up as an update. Pull requests are built and tested
# but nothing is released.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Work out version
        id: version
        run: |
          base=$(sed -nE 's/^version: *([0-9]+\.[0-9]+)\..*/\1/p' pubspec.yaml)
          echo "name=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS repository secrets to publish releases (see README, 'Release signing'). A release signed with a throwaway key could never be updated."
              exit 1
            fi
            echo "No signing secrets: this check build uses the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "ONWARD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "ONWARD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ONWARD_KEY_ALIAS=$KEY_ALIAS"
            echo "ONWARD_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      # One APK per CPU type keeps each download around 18 MB instead of
      # ~50 MB for a universal APK. Obtainium picks the one matching the
      # phone from the ABI in the file name.
      - name: Build APKs
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}

      - name: Name the APKs
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              "onward-${{ steps.version.outputs.name }}-${abi}.apk"
          done
          ls -lh onward-*.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: onward-${{ steps.version.outputs.name }}
          path: onward-*.apk

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Onward ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: onward-*.apk
          generate_release_notes: true
          make_latest: true
